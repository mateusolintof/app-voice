name: PocketMind
options:
  bundleIdPrefix: com.pocketmind
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
  xcodeVersion: 15.0
targets:
  PocketMind:
    type: application
    platform: iOS
    sources:
      - path: PocketMind
        excludes:
          - Features/Assistant/**
          - Features/Chat/**
          - Features/Notes/**
          - App/SideMenuView.swift
          - App/PremiumComponents.swift
          - Core/Data/NoteManager.swift
          - Models/Note.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketmind.app
        INFOPLIST_FILE: PocketMind/Info.plist
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1

  PocketMindMac:
    type: application
    platform: macOS
    sources:
      - path: PocketMind
        excludes:
          - Features/Assistant/**
          - Features/Chat/**
          - Features/Notes/**
          - App/SideMenuView.swift
          - App/PremiumComponents.swift
          - Core/Data/NoteManager.swift
          - Models/Note.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketmind.mac
        INFOPLIST_FILE: PocketMind/Info-macOS.plist
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
